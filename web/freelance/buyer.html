<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Freelance | Buyer</title>

        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /> 
        <meta http-equiv="Pragma" content="no-cache" /> 
        <meta http-equiv="Expires" content="0" />

        <link rel="stylesheet" href="../public/css/bootstrap.css" />
        <link rel="stylesheet" href="../public/css/fontawesome.css" />
        <link rel="stylesheet" href="../public/css/styles.css" />
        <script src="../public/js/jquery.js"></script>
        <script src="../public/js/bootstrap.js"></script>

        <script src="../public/js/react.development.js"></script>
        <script src="../public/js/react-dom.development.js"></script>
        <script src="../public/js/babel.min.js"></script>
        <script src="../public/js/axios.min.js"></script>
        <script src="../public/js/sweetalert2@11.js"></script>
        <script src="../public/js/fontawesome.js"></script>

        <link rel="stylesheet" href="../public/datetimepicker/jquery.datetimepicker.min.css" />
        <script src="../public/datetimepicker/jquery.datetimepicker.full.js"></script>

        <link rel="stylesheet" href="../public/RichText/richtext.min.css" />
        <script src="../public/RichText/jquery.richtext.js"></script>

        <script src="../public/js/script.js"></script>
        <script type="text/babel" src="../public/components/BlogSidebar.js"></script>
        <script type="text/babel" src="../public/components/DynamicTag.js"></script>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light" id="header-app">
            
        </nav>

        <script type="text/babel" src="../public/components/Header.js"></script>

        <div class="container mt-5" id="buyer-app">
            
            <script type="text/babel">
                
                function Buyer() {

                    const [creating, setCreating] = React.useState(false);

                    async function createTask() {
                        setCreating(true);

                        try {
                            const form = document.getElementById("form-create-task");
                            const formData = new FormData(form);

                            const response = await axios.post(
                                apiUrl + "/freelance/create-task",
                                formData,
                                {
                                    headers: {
                                        Authorization: "Bearer " + localStorage.getItem(accessTokenKey)
                                    }
                                }
                            );

                            if (response.data.status == "success") {
                                const task = response.data.task;
                                swal.fire("Create Task", response.data.message, "success")
                                    .then(function () {
                                        window.location.href = baseUrl + "/freelance/task-detail.html?id=" + task._id;
                                    });
                            } else {
                                swal.fire("Error", response.data.message, "error");
                            }
                        } catch (exp) {
                            console.log(exp.message);
                        } finally {
                            setCreating(false);
                        }
                    }

                    React.useEffect(function () {
                        // $("input[name='deadline']").datetimepicker({
                        //     format: "Y-m-d H:i:s"
                        // });

                        $("textarea[name='description']").richText();
                    }, []);

                    return (
                        <>
                            <form onSubmit={ function (event) {
                                event.preventDefault();
                                createTask();
                            } } id="form-create-task">
                                <div className="form-group">
                                    <label className="form-label">Title</label>
                                    <input type="text" name="title" className="form-control" required />
                                </div>

                                <div className="form-group mt-3 mb-3">
                                    <label className="form-label">Description</label>
                                    <textarea name="description" className="form-control" required></textarea>
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Images/Videos</label>
                                    <input type="file" accept="image/*, video/*" multiple name="files[]" className="form-control" />
                                </div>

                                <div className="form-group mt-3 mb-3">
                                    <label className="form-label">Budget (USD)</label>
                                    <input type="number" name="budget" min="0" className="form-control" required />
                                </div>

                                <div className="form-group">
                                    <label className="form-label">Deadline (in days)</label>
                                    <input type="number" min="1" defaultValue="1" name="deadline" className="form-control" required />
                                </div>

                                <input type="submit" value="Create" className="btn btn-primary mt-3" disabled={ creating } />
                            </form>
                        </>
                    );
                }

                ReactDOM.createRoot(
                    document.getElementById("buyer-app")
                ).render(<Buyer />);

            </script>

        </div>
    </body>
</html>
