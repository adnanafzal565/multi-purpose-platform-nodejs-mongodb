<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Freelance | Task Detail</title>

        <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" /> 
        <meta http-equiv="Pragma" content="no-cache" /> 
        <meta http-equiv="Expires" content="0" />

        <link rel="stylesheet" href="../public/css/bootstrap.css" />
        <link rel="stylesheet" href="../public/css/fontawesome.css" />
        <link rel="stylesheet" href="../public/css/styles.css" />
        <script src="../public/js/jquery.js"></script>
        <script src="../public/js/bootstrap.js"></script>

        <script src="../public/js/react.development.js"></script>
        <script src="../public/js/react-dom.development.js"></script>
        <script src="../public/js/babel.min.js"></script>
        <script src="../public/js/axios.min.js"></script>
        <script src="../public/js/sweetalert2@11.js"></script>
        <script src="../public/js/fontawesome.js"></script>

        <link rel="stylesheet" href="../public/datetimepicker/jquery.datetimepicker.min.css" />
        <script src="../public/datetimepicker/jquery.datetimepicker.full.js"></script>

        <link rel="stylesheet" href="../public/RichText/richtext.min.css" />
        <script src="../public/RichText/jquery.richtext.js"></script>

        <script src="../public/js/script.js"></script>
        <script type="text/babel" src="../public/components/BlogSidebar.js"></script>
        <script type="text/babel" src="../public/components/DynamicTag.js"></script>
    </head>

    <body>
        <nav class="navbar navbar-expand-lg navbar-light bg-light" id="header-app">
            
        </nav>

        <script type="text/babel" src="../public/components/Header.js"></script>

        <div class="container mt-5" id="task-detail-app">
            
            <script type="text/babel">

                const urlSearchParams = new URLSearchParams(window.location.search);
                const id = urlSearchParams.get("id") || "";
                let page = urlSearchParams.get("page") || 1;

                function TaskDetail() {

                    const [task, setTask] = React.useState(null);
                    const [fetchingTask, setFetchingTask] = React.useState(false);
                    const [bidding, setBidding] = React.useState(false);
                    const [fetchingBids, setFetchingBids] = React.useState(false);
                    const [pages, setPages] = React.useState(0);
                    const [bids, setBids] = React.useState([]);
                    const [refetch, setRefetch] = React.useState(0);

                    async function fetchBids() {
                        setFetchingBids(true);

                        try {
                            const formData = new FormData();
                            formData.append("_id", id);
                            formData.append("page", page);
                            formData.append("timeZone", Intl.DateTimeFormat().resolvedOptions().timeZone);

                            const response = await axios.post(
                                apiUrl + "/freelance/fetch-bids",
                                formData,
                                {
                                    headers: {
                                        Authorization: "Bearer " + localStorage.getItem(accessTokenKey)
                                    }
                                }
                            );

                            if (response.data.status == "success") {
                                setBids(response.data.bids);
                                setPages(response.data.pages);
                            } else {
                                swal.fire("Error", response.data.message, "error");
                            }
                        } catch (exp) {
                            console.log(exp.message);
                        } finally {
                            setFetchingBids(false);
                        }
                    }

                    async function fetchTask() {
                        setFetchingTask(true);

                        try {
                            const formData = new FormData();
                            formData.append("_id", id);
                            formData.append("page", page);
                            formData.append("timeZone", Intl.DateTimeFormat().resolvedOptions().timeZone);

                            const response = await axios.post(
                                apiUrl + "/freelance/fetch-task",
                                formData,
                                {
                                    headers: {
                                        Authorization: "Bearer " + localStorage.getItem(accessTokenKey)
                                    }
                                }
                            );

                            if (response.data.status == "success") {
                                setTask(response.data.task);
                                setBids(response.data.bids);
                                setPages(response.data.pages);

                                document.title = response.data.task.title || "";
                            } else {
                                swal.fire("Error", response.data.message, "error");
                            }
                        } catch (exp) {
                            console.log(exp.message);
                        } finally {
                            setFetchingTask(false);
                        }
                    }

                    async function bidNow() {
                        setBidding(true);

                        try {
                            const form = document.getElementById("form-bid-now");
                            const formData = new FormData(form);
                            formData.append("_id", id);

                            const response = await axios.post(
                                apiUrl + "/freelance/create-bid",
                                formData,
                                {
                                    headers: {
                                        Authorization: "Bearer " + localStorage.getItem(accessTokenKey)
                                    }
                                }
                            );

                            if (response.data.status == "success") {
                                swal.fire("Bid Applied", response.data.message, "success");
                                $("#bid-now-modal").modal("hide");
                            } else {
                                swal.fire("Error", response.data.message, "error");
                            }
                        } catch (exp) {
                            console.log(exp.message);
                        } finally {
                            setBidding(false);
                        }
                    }

                    function acceptBid(event, id) {
                        const node = event.target;

                        swal.fire({
                            title: "Accept Bid ?",
                            text: "This will start the order.",
                            icon: "warning",
                            showCancelButton: true,
                            confirmButtonColor: "#3085d6",
                            cancelButtonColor: "#d33",
                            confirmButtonText: "Yes, accept it!"
                        }).then(async function (result) {
                            if (result.isConfirmed) {
                                
                                node.setAttribute("disabled", "disabled");

                                try {
                                    const formData = new FormData();
                                    formData.append("_id", id);

                                    const response = await axios.post(
                                        apiUrl + "/freelance/accept-bid",
                                        formData,
                                        {
                                            headers: {
                                                Authorization: "Bearer " + localStorage.getItem(accessTokenKey)
                                            }
                                        }
                                    );

                                    if (response.data.status == "success") {
                                        swal.fire("Bid Accepted", response.data.message, "success");

                                        const temp = JSON.parse(JSON.stringify(bids));
                                        for (let a = 0; a < temp.length; a++) {
                                            if (temp[a]._id == id) {
                                                temp[a].status = "accepted";
                                            } else {
                                                temp[a].status = "declined";
                                            }
                                        }
                                        setBids(temp);
                                    } else {
                                        swal.fire("Error", response.data.message, "error");
                                    }
                                } catch (exp) {
                                    console.log(exp.message);
                                } finally {
                                    node.removeAttribute("disabled");
                                }
                            }
                        });
                    }

                    React.useEffect(function () {
                        fetchTask();

                        setTimeout(function () {
                            $("textarea[name='description']").richText();
                        }, 1000);
                    }, []);

                    React.useEffect(function () {
                        if (refetch > 0) {
                            fetchBids();
                        }
                    }, [refetch]);

                    const styles = {
                        profileImage: {
                            width: "300px"
                        },
                        image: {
                            width: "300px"
                        },
                        userImage: {
                            width: "100px",
                            height: "100px",
                            objectFit: "cover",
                            borderRadius: "50%",
                            marginBottom: "20px"
                        }
                    };

                    return (
                        <>
                            
                            { fetchingTask && (
                                <p>Fetching Task...</p>
                            ) }

                            { task != null && (
                                <>
                                    <div className="row mt-5">
                                        <div className="col-md-12">
                                            <div className="card card-body">
                                                <div className="row">
                                                    <div className="col-md-4">
                                                        <img src={ task.user?.profileImage || "" }
                                                            style={ styles.profileImage } />

                                                        <p className="mt-3">{ task.user?.name || "" }</p>
                                                    </div>

                                                    <div className="col-md-8">
                                                        <h3>{ task.title }</h3>

                                                        <p>
                                                            Budget: USD { task.budget }<br />
                                                            Deadline: { task.deadline } days<br />
                                                            Bids: { task.bids }<br />
                                                            Status: { task.status }<br />
                                                            Posted at: { task.createdAt }
                                                        </p>
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    </div>

                                    { task?.files.length > 0 && (
                                        <div className="row mt-3 mb-5">
                                            <div className="col-md-12">
                                                <h2>Files</h2>

                                                <div className="card card-body">
                                                    <div className="row">
                                                        { task?.files.map(function (file, index) {
                                                            return (
                                                                <div className="col-md-4" key={ `file-${ index }` }>
                                                                    { file.type.includes("image") && (
                                                                        <img src={ file.path }
                                                                            style={ styles.image } />
                                                                    ) }

                                                                    { file.type.includes("video") && (
                                                                        <video src={ file.path }
                                                                            style={ styles.image }
                                                                            controls></video>
                                                                        ) }
                                                                </div>
                                                            );
                                                        }) }
                                                    </div>
                                                </div>
                                            </div>
                                        </div>
                                    ) }

                                    <div className="row mb-5 mt-3">
                                        <div className="col-md-3">
                                            <button type="button" onClick={ function () {
                                                $("#bid-now-modal").modal("show");
                                            } } className="btn btn-primary">Bid Now</button>
                                        </div>
                                    </div>

                                    { bids.map(function (bid, bidIndex) {
                                        return (
                                            <div className="row mt-3" key={ `bid-${ bid._id }` }>
                                                <div className="col-md-12">
                                                    <div className="card card-body">
                                                        <div className="row">
                                                            <div className="col-md-4">
                                                                <img src={ bid.user?.profileImage || "" }
                                                                    style={ styles.userImage }
                                                                    onError={ function (event) {
                                                                        event.target.src = baseUrl + "/public/img/user-placeholder.png";
                                                                    } } />

                                                                <p>{ bid.user?.name || "" }</p>

                                                                { bid.freelanceProfile != null && (
                                                                    <>
                                                                        <p>
                                                                            Orders: { bid.freelanceProfile.orders || 0 } <br />
                                                                            Completed Orders: { bid.freelanceProfile.completedOrders || 0 } <br />
                                                                            Cancelled Orders: { bid.freelanceProfile.cancelledOrders || 0 } <br />
                                                                            Ratings: { bid.freelanceProfile.ratings || 0 } <br />
                                                                            Reviews: { bid.freelanceProfile.reviews || 0 }
                                                                        </p>
                                                                    </>
                                                                ) }
                                                            </div>

                                                            <div className="col-md-6">
                                                                <h2>Proposal</h2>
                                                                <div>{ HTMLReactParser(bid.description) }</div>

                                                                <p className="mt-5">
                                                                    Offer: { bid.offer } USD<br />
                                                                    Deadline: { bid.deadline }<br />
                                                                    Bid At: { bid.createdAt }
                                                                </p>
                                                            </div>

                                                            <div className="col-md-2">
                                                                <button type="button" className="btn btn-success"
                                                                    onClick={ function (event) {
                                                                        acceptBid(event, bid._id);
                                                                    } }>Accept</button>
                                                            </div>
                                                        </div>
                                                    </div>
                                                </div>
                                            </div>
                                        );
                                    }) }

                                    { pages > 1 && (
                                        <nav className="mt-5 mb-5">
                                            <ul className="pagination">
                                                { Array.from({ length: pages }, function (_, index) { return index + 1 } )
                                                    .map(function (p) {
                                                        return (
                                                            <li key={ `pagination-${ p }` }
                                                                className={ `page-item ${ p == page ? "active" : "" }` }>
                                                            <a className="page-link" href="#"
                                                                onClick={ function (event) {
                                                                    event.preventDefault();
                                                                    page = p;
                                                                    setRefetch(refetch + 1);
                                                                } }>{ p }</a>
                                                            </li>
                                                        );
                                                    }) }
                                            </ul>
                                        </nav>
                                    ) }

                                    <div className="modal fade" id="bid-now-modal">
                                        <div className="modal-dialog modal-lg">
                                            <div className="modal-content">
                                                <div className="modal-header">
                                                    <h5 className="modal-title">Bid Now</h5>
                                                    <button type="button" className="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                                </div>

                                                <div className="modal-body">

                                                    <form id="form-bid-now" onSubmit={ function (event) {
                                                        event.preventDefault();
                                                        bidNow();
                                                    } }>
                                                        <div className="form-group">
                                                            <label className="form-label">Description</label>
                                                            <textarea name="description" className="form-control"></textarea>
                                                        </div>

                                                        <div className="form-group">
                                                            <label className="form-label">Offer (USD)</label>
                                                            <input type="number" min="0" name="offer" className="form-control" />
                                                        </div>

                                                        <div className="form-group">
                                                            <label className="form-label">Deadline (in days)</label>
                                                            <input type="number" min="0" name="deadline" autoComplete="off" className="form-control" />
                                                        </div>
                                                    </form>
                                                    
                                                </div>

                                                <div className="modal-footer">
                                                    <button type="button" className="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                                                    <button type="submit" disabled={ bidding } form="form-bid-now" className="btn btn-primary">Bid Now</button>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </>
                            ) }

                        </>
                    );
                }

                ReactDOM.createRoot(
                    document.getElementById("task-detail-app")
                ).render(<TaskDetail />);
            </script>

        </div>
    </body>
</html>
